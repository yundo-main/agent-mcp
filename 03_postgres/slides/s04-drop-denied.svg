" height="42" rx="0" fill="#ffffff" stroke="#c9d5e1" stroke-width="1"/><text x="285" y="264" font-family="ui-monospace, Menlo, 'SF Mono', monospace" font-size="16" font-weight="700" fill="#1a7f4b" text-anchor="start" xml:space="preserve" style="white-space:pre">ok</text><rect x="365" y="237" width="110" height="42" rx="0" fill="#ffffff" stroke="#c9d5e1" stroke-width="1"/><text x="375" y="264" font-family="ui-monospace, Menlo, 'SF Mono', monospace" font-size="14" font-weight="400" fill="#122033" text-anchor="start" xml:space="preserve" style="white-space:pre">11</text><rect x="475" y="237" width="120" height="42" rx="0" fill="#ffffff" stroke="#c9d5e1" stroke-width="1"/><text x="485" y="264" font-family="ui-monospace, Menlo, 'SF Mono', monospace" font-size="14" font-weight="400" fill="#122033" text-anchor="start" xml:space="preserve" style="white-space:pre">execute_sql</text><rect x="595" y="237" width="375" height="42" rx="0" fill="#ffffff" stroke="#c9d5e1" stroke-width="1"/><text x="605" y="264" font-family="ui-monospace, Menlo, 'SF Mono', monospace" font-size="14" font-weight="400" fill="#122033" text-anchor="start" xml:space="preserve" style="white-space:pre">[{'count': 5}]</text><rect x="970" y="237" width="250" height="42" rx="0" fill="#ffffff" stroke="#c9d5e1" stroke-width="1"/><text x="980" y="264" font-family="ui-monospace, Menlo, 'SF Mono', monospace" font-size="14" font-weight="400" fill="#122033" text-anchor="start" xml:space="preserve" style="white-space:pre">SELECT count(*) FROM orders</text><rect x="60" y="279" width="215" height="42" rx="0" fill="#ffffff" stroke="#c9d5e1" stroke-width="1"/><text x="70" y="306" font-family="ui-monospace, Menlo, 'SF Mono', monospace" font-size="14" font-weight="400" fill="#122033" text-anchor="start" xml:space="preserve" style="white-space:pre">(a) restricted + app_ro</text><rect x="275" y="279" width="90" height="42" rx="0" fill="#ffffff" stroke="#c9d5e1" stroke-width="1"/><text x="285" y="306" font-family="ui-monospace, Menlo, 'SF Mono', monospace" font-size="16" font-weight="700" fill="#c0392b" text-anchor="start" xml:space="preserve" style="white-space:pre">denied</text><rect x="365" y="279" width="110" height="42" rx="0" fill="#ffffff" stroke="#c9d5e1" stroke-width="1"/><text x="375" y="306" font-family="ui-monospace, Menlo, 'SF Mono', monospace" font-size="14" font-weight="400" fill="#122033" text-anchor="start" xml:space="preserve" style="white-space:pre">5</text><rect x="475" y="279" width="120" height="42" rx="0" fill="#ffffff" stroke="#c9d5e1" stroke-width="1"/><text x="485" y="306" font-family="ui-monospace, Menlo, 'SF Mono', monospace" font-size="14" font-weight="400" fill="#122033" text-anchor="start" xml:space="preserve" style="white-space:pre">execute_sql</text><rect x="595" y="279" width="375" height="42" rx="0" fill="#ffffff" stroke="#c9d5e1" stroke-width="1"/><text x="605" y="306" font-family="ui-monospace, Menlo, 'SF Mono', monospace" font-size="14" font-weight="400" fill="#122033" text-anchor="start" xml:space="preserve" style="white-space:pre">Error validating query: DROP TABLE orders</text><rect x="970" y="279" width="250" height="42" rx="0" fill="#ffffff" stroke="#c9d5e1" stroke-width="1"/><text x="980" y="306" font-family="ui-monospace, Menlo, 'SF Mono', monospace" font-size="14" font-weight="400" fill="#122033" text-anchor="start" xml:space="preserve" style="white-space:pre">DROP TABLE orders</text><rect x="60" y="321" width="215" height="42" rx="0" fill="#ffffff" stroke="#c9d5e1" stroke-width="1"/><text x="70" y="348" font-family="ui-monospace, Menlo, 'SF Mono', monospace" font-size="14" font-weight="400" fill="#122033" text-anchor="start" xml:space="preserve" style="white-space:pre">(b) unrestricted + app_ro</text><rect x="275" y="321" width="90" height="42" rx="0" fill="#ffffff" stroke="#c9d5e1" stroke-width="1"/><text x="285" y="348" font-family="ui-monospace, Menlo, 'SF Mono', monospace" font-size="16" font-weight="700" fill="#c0392b" text-anchor="start" xml:space="preserve" style="white-space:pre">denied</text><rect x="365" y="321" width="110" height="42" rx="0" fill="#ffffff" stroke="#c9d5e1" stroke-width="1"/><text x="375" y="348" font-family="ui-monospace, Menlo, 'SF Mono', monospace" font-size="14" font-weight="400" fill="#122033" text-anchor="start" xml:space="preserve" style="white-space:pre">3</text><rect x="475" y="321" width="120" height="42" rx="0" fill="#ffffff" stroke="#c9d5e1" stroke-width="1"/><text x="485" y="348" font-family="ui-monospace, Menlo, 'SF Mono', monospace" font-size="14" font-weight="400" fill="#122033" text-anchor="start" xml:space="preserve" style="white-space:pre">execute_sql</text><rect x="595" y="321" width="375" height="42" rx="0" fill="#ffffff" stroke="#c9d5e1" stroke-width="1"/><text x="605" y="348" font-family="ui-monospace, Menlo, 'SF Mono', monospace" font-size="14" font-weight="400" fill="#122033" text-anchor="start" xml:space="preserve" style="white-space:pre">must be owner of table orders</text><rect x="970" y="321" width="250" height="42" rx="0" fill="#ffffff" stroke="#c9d5e1" stroke-width="1"/><text x="980" y="348" font-family="ui-monospace, Menlo, 'SF Mono', monospace" font-size="14" font-weight="400" fill="#122033" text-anchor="start" xml:space="preserve" style="white-space:pre">DROP TABLE orders</text><rect x="60" y="390" width="570" height="120" rx="12" fill="#eef1f4" stroke="#b86e00" stroke-width="2"/><text x="84" y="425" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="20" font-weight="700" fill="#b86e00" text-anchor="start" xml:space="preserve" style="white-space:pre">(a) 서버 모드가 막음</text><text x="84" y="457" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="18" font-weight="400" fill="#122033" text-anchor="start" xml:space="preserve" style="white-space:pre">restricted 는 편의 기능</text><text x="84" y="485" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="18" font-weight="400" fill="#516174" text-anchor="start" xml:space="preserve" style="white-space:pre">우회 사례가 보고된 적이 있다</text><rect x="650" y="390" width="570" height="120" rx="12" fill="#e6f1fa" stroke="#1a7f4b" stroke-width="2.5"/><text x="674" y="425" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="20" font-weight="700" fill="#1a7f4b" text-anchor="start" xml:space="preserve" style="white-space:pre">(b) 서버 모드를 풀어도 DB가 막음</text><text x="674" y="457" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="18" font-weight="400" fill="#122033" text-anchor="start" xml:space="preserve" style="white-space:pre">롤에 DROP 권한이 없다</text><text x="674" y="485" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="18" font-weight="700" fill="#1a7f4b" text-anchor="start" xml:space="preserve" style="white-space:pre">→ 진짜 경계</text><text x="60" y="540" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="17" font-weight="400" fill="#516174" text-anchor="start" xml:space="preserve" style="white-space:pre">서버는 실패도 정상 응답 본문("Error: …")으로 돌려준다 → 클라이언트가 본문을 보고 denied로 판정한다</text><rect x="60" y="570" width="1160" height="60" rx="12" fill="#e6f1fa" stroke="#1769aa" stroke-width="1.5"/><text x="640" y="608" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="23" font-weight="700" fill="#1769aa" text-anchor="middle" xml:space="preserve" style="white-space:pre">서버 설정을 풀어도 DB 롤이 막으면 안전하다</text><text x="60" y="700" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="16" font-weight="400" fill="#516174" text-anchor="start" xml:space="preserve" style="white-space:pre">MCP · 03 · Postgres</text><text x="1220" y="700" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="16" font-weight="600" fill="#516174" text-anchor="end" xml:space="preserve" style="white-space:pre">04</text></svg>
