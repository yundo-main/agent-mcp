if" font-size="28" font-weight="700" fill="#ffffff" text-anchor="middle" xml:space="preserve" style="white-space:pre">4</text><text x="156" y="246" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="32" font-weight="700" fill="#1a7f4b" text-anchor="start" xml:space="preserve" style="white-space:pre">인젝션·오판이 곧바로 데이터 손실이 된다</text><text x="96" y="304" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="21" font-weight="400" fill="#122033" text-anchor="start" xml:space="preserve" style="white-space:pre">프롬프트 인젝션이나 모델의 오판으로 DROP · UPDATE · DELETE 가 실제로 실행될 수 있다</text><text x="96" y="344" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="21" font-weight="400" fill="#122033" text-anchor="start" xml:space="preserve" style="white-space:pre">읽기 전용 계정이 기본이고, 쓰기가 필요하면 사람 승인(HITL)을 거친다</text><rect x="60" y="405" width="1160" height="110" rx="14" fill="#e6f1fa" stroke="#1a7f4b" stroke-width="2"/><text x="84" y="442" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="18" font-weight="700" fill="#1a7f4b" text-anchor="start" xml:space="preserve" style="white-space:pre">기본값</text><text x="84" y="480" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="22" font-weight="700" fill="#122033" text-anchor="start" xml:space="preserve" style="white-space:pre">DB 롤 app_ro (SELECT만) → 서버 restricted → 위험 작업은 사람이 확인</text><rect x="60" y="545" width="1160" height="60" rx="12" fill="#e6f1fa" stroke="#1769aa" stroke-width="1.5"/><text x="640" y="583" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="23" font-weight="700" fill="#1769aa" text-anchor="middle" xml:space="preserve" style="white-space:pre">최소 권한 + 사람 승인</text><text x="60" y="700" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="16" font-weight="400" fill="#516174" tex