ace="preserve" style="white-space:pre">DATABASE_URI</text><text x="814" y="290" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="18" font-weight="400" fill="#122033" text-anchor="start" xml:space="preserve" style="white-space:pre">.env 로만 주입한다</text><text x="814" y="322" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="18" font-weight="400" fill="#122033" text-anchor="start" xml:space="preserve" style="white-space:pre">코드·슬라이드·로그에</text><text x="814" y="354" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="18" font-weight="400" fill="#122033" text-anchor="start" xml:space="preserve" style="white-space:pre">값을 노출하지 않는다</text><text x="814" y="386" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="18" font-weight="400" fill="#122033" text-anchor="start" xml:space="preserve" style="white-space:pre"></text><text x="814" y="418" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="18" font-weight="400" fill="#122033" text-anchor="start" xml:space="preserve" style="white-space:pre">읽기 전용 롤의 계정을</text><text x="814" y="450" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="18" font-weight="400" fill="#122033" text-anchor="start" xml:space="preserve" style="white-space:pre">연결 문자열에 쓴다</text><rect x="60" y="540" width="1160" height="60" rx="12" fill="#e6f1fa" stroke="#1769aa" stroke-width="1.5"/><text x="640" y="578" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="23" font-weight="700" fill="#1769aa" text-anchor="middle" xml:space="preserve" style="white-space:pre">서버 모드는 편의, DB 권한이 안전장치</text><text x="60" y="700" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="16" font-weight="400" fill="#516174" text-anchor="start" xml:space="preserve" style="white-space:pr