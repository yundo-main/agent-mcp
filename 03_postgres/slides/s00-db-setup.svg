<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-label="DB 준비"><rect width="1280" height="720" fill="#f8fafc"/><rect width="1280" height="10" fill="#1769aa"/><text x="60" y="90" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="40" font-weight="700" fill="#122033" text-anchor="start" xml:space="preserve" style="white-space:pre">DB 준비 — 실습 전에 한 번만</text><text x="60" y="134" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="22" font-weight="400" fill="#516174" text-anchor="start" xml:space="preserve" style="white-space:pre">세 단계를 끝내고 5건이 나와야 03 단계가 동작한다</text><rect x="60" y="170" width="360" height="340" rx="14" fill="#ffffff" stroke="#1769aa" stroke-width="2.5"/><text x="80" y="208" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="22" font-weight="700" fill="#1769aa" text-anchor="start" xml:space="preserve" style="white-space:pre">① DB 기동 · 수신 확인</text><text x="80" y="250" font-family="ui-monospace, Menlo, 'SF Mono', monospace" font-size="14" font-weight="400" fill="#122033" text-anchor="start" xml:space="preserve" style="white-space:pre">brew services start</text><text x="80" y="276" font-family="ui-monospace, Menlo, 'SF Mono', monospace" font-size="14" font-weight="400" fill="#122033" text-anchor="start" xml:space="preserve" style="white-space:pre">  postgresql@16</text><text x="80" y="302" font-family="ui-monospace, Menlo, 'SF Mono', monospace" font-size="14" font-weight="400" fill="#122033" text-anchor="start" xml:space="preserve" style="white-space:pre">lsof -nP -iTCP:5432</text><text x="80" y="328" font-family="ui-monospace, Menlo, 'SF Mono', monospace" font-size="14" font-weight="400" fill="#122033" text-anchor="start" xml:space="preserve" style="white-space:pre">  -sTCP:LISTEN</text><text x="80" y="390" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="18" font-weight="400" fill="#122033" text-anchor="start" xml:space="preserve" style="white-space:pre">LISTEN 줄이 나오면 OK</text><text x="80" y="420" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="18" font-weight="400" fill="#122033" text-anchor="start" xml:space="preserve" style="white-space:pre">(안 나오면 몇 초 뒤 재시도)</text><rect x="460" y="170" width="360" height="340" rx="14" fill="#ffffff" stroke="#b86e00" stroke-width="2.5"/><text x="480" y="208" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="22" font-weight="700" fill="#b86e00" text-anchor="start" xml:space="preserve" style="white-space:pre">② 샘플 데이터 (1회)</text><text x="480" y="250" font-family="ui-monospace, Menlo, 'SF Mono', monospace" font-size="14" font-weight="400" fill="#122033" text-anchor="start" xml:space="preserve" style="white-space:pre">psql -d postgres \</text><text x="480" y="276" font-family="ui-monospace, Menlo, 'SF Mono', monospace" font-size="14" font-weight="400" fill="#122033" text-anchor="start" xml:space="preserve" style="white-space:pre">  -f 03_postgres/setup.sql</text><text x="480" y="390" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="18" font-weight="400" fill="#122033" text-anchor="start" xml:space="preserve" style="white-space:pre">orders 5건 + 읽기 전용 롤</text><text x="480" y="420" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="18" font-weight="400" fill="#122033" text-anchor="start" xml:space="preserve" style="white-space:pre">app_ro 를 만든다</text><text x="480" y="450" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="18" font-weight="400" fill="#122033" text-anchor="start" xml:space="preserve" style="white-space:pre">슈퍼유저로 실행</text><rect x="860" y="170" width="360" height="340" rx="14" fill="#ffffff" stroke="#1a7f4b" stroke-width="2.5"/><text x="880" y="208" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="22" font-weight="700" fill="#1a7f4b" text-anchor="start" xml:space="preserve" style="white-space:pre">③ app_ro 로 확인</text><text x="880" y="250" font-family="ui-monospace, Menlo, 'SF Mono', monospace" font-size="14" font-weight="400" fill="#122033" text-anchor="start" xml:space="preserve" style="white-space:pre">psql "postgresql://app_ro:</text><text x="880" y="276" font-family="ui-monospace, Menlo, 'SF Mono', monospace" font-size="14" font-weight="400" fill="#122033" text-anchor="start" xml:space="preserve" style="white-space:pre">  app_ro_pw@localhost:5432/</text><text x="880" y="302" font-family="ui-monospace, Menlo, 'SF Mono', monospace" font-size="14" font-weight="400" fill="#122033" text-anchor="start" xml:space="preserve" style="white-space:pre">  postgres" \</text><text x="880" y="328" font-family="ui-monospace, Menlo, 'SF Mono', monospace" font-size="14" font-weight="400" fill="#122033" text-anchor="start" xml:space="preserve" style="white-space:pre">  -c "SELECT count(*) FROM orders;"</text><text x="880" y="390" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="18" font-weight="400" fill="#122033" text-anchor="start" xml:space="preserve" style="white-space:pre">결과 5 → 준비 끝</text><rect x="60" y="540" width="1160" height="60" rx="12" fill="#e6f1fa" stroke="#1769aa" stroke-width="1.5"/><text x="640" y="578" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="23" font-weight="700" fill="#1769aa" text-anchor="middle" xml:space="preserve" style="white-space:pre">.env 의 DATABASE_URI 를 ③의 연결 문자열과 같게 맞춘다</text><text x="60" y="640" font-family="ui-monospace, Menlo, 'SF Mono', monospace" font-size="16" font-weight="400" fill="#516174" text-anchor="start" xml:space="preserve" style="white-space:pre">psql 을 못 찾으면: export PATH="/opt/homebrew/opt/postgresql@16/bin:$PATH"  (새 터미널마다 필요)</text><text x="60" y="700" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="16" font-weight="400" fill="#516174" text-anchor="start" xml:space="preserve" style="white-space:pre">MCP · 03 · Postgres</text><text x="1220" y="700" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="16" font-weight="600" fill="#516174" text-anchor="end" xml:space="preserve" style="white-space:pre">03</text></svg>