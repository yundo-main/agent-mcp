<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-label="생각해보기 — 정답"><defs><marker id="ah1769aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1769aa"/></marker><marker id="ah516174" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#516174"/></marker><marker id="ah1a7f4b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1a7f4b"/></marker><marker id="ahc0392b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#c0392b"/></marker><marker id="ahb86e00" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#b86e00"/></marker><marker id="ah8a96a3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8a96a3"/></marker></defs><rect width="1280" height="720" fill="#f8fafc"/><rect width="1280" height="10" fill="#1769aa"/><text x="60" y="90" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="40" font-weight="700" fill="#122033" text-anchor="start" xml:space="preserve" style="white-space:pre">생각해보기 — 정답</text><text x="60" y="134" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="22" font-weight="400" fill="#516174" text-anchor="start" xml:space="preserve" style="white-space:pre">02 파일시스템 단계</text><rect x="60" y="170" width="1160" height="210" rx="14" fill="#ffffff" stroke="#1a7f4b" stroke-width="2.5"/><circle cx="110" cy="232" r="26" fill="#1a7f4b"/><text x="110" y="241.8" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="28" font-weight="700" fill="#ffffff" text-anchor="middle" xml:space="preserve" style="white-space:pre">3</text><text x="156" y="246" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="32" font-weight="700" fill="#1a7f4b" text-anchor="start" xml:space="preserve" style="white-space:pre">서버가 허용 디렉터리 밖을 거절한다</text><text x="96" y="304" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="21" font-weight="400" fill="#122033" text-anchor="start" xml:space="preserve" style="white-space:pre">서버는 시작 인자로 받은 경로 안쪽만 처리하고, 그 밖은 오류로 돌려준다</text><text x="96" y="344" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="21" font-weight="400" fill="#122033" text-anchor="start" xml:space="preserve" style="white-space:pre">보안 경계는 모델의 "양심"(프롬프트)이 아니라 서버·OS 권한에 둬야 한다</text><rect x="60" y="405" width="560" height="90" rx="14" fill="#eef1f4" stroke="#c0392b" stroke-width="2.5"/><text x="340" y="458" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="21" font-weight="700" fill="#c0392b" text-anchor="middle" xml:space="preserve" style="white-space:pre">프롬프트로 부탁 — "/etc는 읽지 마"</text><rect x="660" y="405" width="560" height="90" rx="14" fill="#e6f1fa" stroke="#1a7f4b" stroke-width="2.5"/><text x="940" y="458" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="21" font-weight="700" fill="#1a7f4b" text-anchor="middle" xml:space="preserve" style="white-space:pre">서버 인자 + OS 권한 — 허용 디렉터리</text><text x="640" y="525" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="18" font-weight="400" fill="#516174" text-anchor="middle" xml:space="preserve" style="white-space:pre">모델은 속을 수 있다 (프롬프트 인젝션) — 서버·권한은 속지 않는다</text><rect x="60" y="555" width="1160" height="60" rx="12" fill="#e6f1fa" stroke="#1769aa" stroke-width="1.5"/><text x="640" y="593" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="23" font-weight="700" fill="#1769aa" text-anchor="middle" xml:space="preserve" style="white-space:pre">프롬프트로 부탁하는 보안은 보안이 아니다</text><text x="60" y="700" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="16" font-weight="400" fill="#516174" text-anchor="start" xml:space="preserve" style="white-space:pre">MCP · 02 · 파일시스템</text><text x="1220" y="700" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="16" font-weight="600" fill="#516174" text-anchor="end" xml:space="preserve" style="white-space:pre">07</text></svg>
