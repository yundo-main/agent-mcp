#122033" text-anchor="start" xml:space="preserve" style="white-space:pre">from mcp.server.mcpserver import MCPServer</text><text x="84" y="222" font-family="ui-monospace, Menlo, 'SF Mono', monospace" font-size="15" font-weight="400" fill="#122033" text-anchor="start" xml:space="preserve" style="white-space:pre"></text><text x="84" y="247" font-family="ui-monospace, Menlo, 'SF Mono', monospace" font-size="15" font-weight="400" fill="#122033" text-anchor="start" xml:space="preserve" style="white-space:pre">mcp = MCPServer("demo")</text><text x="84" y="272" font-family="ui-monospace, Menlo, 'SF Mono', monospace" font-size="15" font-weight="400" fill="#122033" text-anchor="start" xml:space="preserve" style="white-space:pre"></text><rect x="68" y="281" width="5" height="25" fill="#1769aa"/><text x="84" y="297" font-family="ui-monospace, Menlo, 'SF Mono', monospace" font-size="15" font-weight="400" fill="#122033" text-anchor="start" xml:space="preserve" style="white-space:pre">@mcp.tool()</text><rect x="68" y="306" width="5" height="25" fill="#1769aa"/><text x="84" y="322" font-family="ui-monospace, Menlo, 'SF Mono', monospace" font-size="15" font-weight="400" fill="#122033" text-anchor="start" xml:space="preserve" style="white-space:pre">def add(a: int, b: int) -&gt; int:</text><rect x="68" y="331" width="5" height="25" fill="#1769aa"/><text x="84" y="347" font-family="ui-monospace, Menlo, 'SF Mono', monospace" font-size="15" font-weight="400" fill="#122033" text-anchor="start" xml:space="preserve" style="white-space:pre">    """두 수를 더한다"""</text><rect x="68" y="356" width="5" height="25" fill="#1769aa"/><text x="84" y="372" font-family="ui-monospace, Menlo, 'SF Mono', monospace" font-size="15" font-weight="400" fill="#122033" text-anchor="start" xml:space="preserve" style="white-space:pre">    return a + b</text><text x="84" y="397" font-family="ui-monospace, Menlo, 'SF Mono', monospace" font-size="15" font-weight="400" fill="#122033" text-anchor="start" xml:space="preserve" style="white-space:pre"></text><rect x="68" y="406" width="5" height="25" fill="#1a7f4b"/><text x="84" y="422" font-family="ui-monospace, Menlo, 'SF Mono', monospace" font-size="15" font-weight="400" fill="#122033" text-anchor="start" xml:space="preserve" style="white-space:pre">@mcp.resource("greeting://{name}")</text><rect x="68" y="431" width="5" height="25" fill="#1a7f4b"/><text x="84" y="447" font-family="ui-monospace, Menlo, 'SF Mono', monospace" font-size="15" font-weight="400" fill="#122033" text-anchor="start" xml:space="preserve" style="white-space:pre">def greeting(name: str) -&gt; str:</text><rect x="68" y="456" width="5" height="25" fill="#1a7f4b"/><text x="84" y="472" font-family="ui-monospace, Menlo, 'SF Mono', monospace" font-size="15" font-weight="400" fill="#122033" text-anchor="start" xml:space="preserve" style="white-space:pre">    return f"안녕하세요, {name}님"</text><text x="84" y="497" font-family="ui-monospace, Menlo, 'SF Mono', monospace" font-size="15" font-weight="400" fill="#122033" text-anchor="start" xml:space="preserve" style="white-space:pre"></text><rect x="68" y="506" width="5" height="25" fill="#b86e00"/><text x="84" y="522" font-family="ui-monospace, Menlo, 'SF Mono', monospace" font-size="15" font-weight="400" fill="#122033" text-anchor="start" xml:space="preserve" style="white-space:pre">@mcp.prompt()</text><rect x="68" y="531" width="5" height="25" fill="#b86e00"/><text x="84" y="547" font-family="ui-monospace, Menlo, 'SF Mono', monospace" font-size="15" font-weight="400" fill="#122033" text-anchor="start" xml:space="preserve" style="white-space:pre">def summarize(text: str) -&gt; str:</text><rect x="68" y="556" width="5" height="25" fill="#b86e00"/><text x="84" y="572" font-family="ui-monospace, Menlo, 'SF Mono', monospace" font-size="15" font-weight="400" fill="#122033" text-anchor="start" xml:space="preserve" style="white-space:pre">    return f"다음 글을 3줄로 요약하라:\n{text}"</text><text x="84" y="597" font-family="ui-monospace, Menlo, 'SF Mono', monospace" font-size="15" font-weight="400" fill="#122033" text-anchor="start" xml:space="preserve" style="white-space:pre"></text><text x="84" y="622" font-family="ui-monospace, Menlo, 'SF Mono', monospace" font-size="15" font-weight="400" fill="#122033" text-anchor="start" xml:space="preserve" style="white-space:pre">mcp.run(transport="stdio")</text><rect x="800" y="165" width="420" height="130" rx="12" fill="#ffffff" stroke="#c9d5e1" stroke-width="1.5"/><rect x="800" y="165" width="8" height="130" rx="4" fill="#1769aa"/><text x="826" y="203" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="20" font-weight="700" fill="#1769aa" text-anchor="start" xml:space="preserve" style="white-space:pre">@mcp.tool() → Tools</text><text x="826" y="239" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="18" font-weight="400" fill="#516174" text-anchor="start" xml:space="preserve" style="white-space:pre">함수 시그니처와 docstring이</text><text x="826" y="267" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="18" font-weight="400" fill="#516174" text-anchor="start" xml:space="preserve" style="white-space:pre">입력 스키마·설명이 된다</text><rect x="800" y="315" width="420" height="130" rx="12" fill="#ffffff" stroke="#c9d5e1" stroke-width="1.5"/><rect x="800" y="315" width="8" height="130" rx="4" fill="#1a7f4b"/><text x="826" y="353" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="20" font-weight="700" fill="#1a7f4b" text-anchor="start" xml:space="preserve" style="white-space:pre">@mcp.resource(주소) → Resources</text><text x="826" y="389" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="18" font-weight="400" fill="#516174" text-anchor="start" xml:space="preserve" style="white-space:pre">{name} 템플릿 주소는</text><text x="826" y="417" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="18" font-weight="400" fill="#516174" text-anchor="start" xml:space="preserve" style="white-space:pre">list_resource_templates에 나온다</text><rect x="800" y="465" width="420" height="130" rx="12" fill="#ffffff" stroke="#c9d5e1" stroke-width="1.5"/><rect x="800" y="465" width="8" height="130" rx="4" fill="#b86e00"/><text x="826" y="503" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="20" font-weight="700" fill="#b86e00" text-anchor="start" xml:space="preserve" style="white-space:pre">@mcp.prompt() → Prompts</text><text x="826" y="539" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="18" font-weight="400" fill="#516174" text-anchor="start" xml:space="preserve" style="white-space:pre">사용자가 골라 쓰는</text><text x="826" y="567" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="18" font-weight="400" fill="#516174" text-anchor="start" xml:space="preserve" style="white-space:pre">지시문 템플릿</text><text x="800" y="640" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="20" font-weight="700" fill="#122033" text-anchor="start" xml:space="preserve" style="white-space:pre">함수 하나 + 데코레이터 하나 = 기둥 하나</text><text x="60" y="700" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="16" font-weight="400" fill="#516174" text-anchor="start" xml:space="preserve" style="white-space:pre">MCP · 01 · 기본</text><text x="1220" y="700" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="16" font-weight="600" fill="#516174" text-anchor="end" xml:space="preserve" style="white-space:pre">04</text></svg>
