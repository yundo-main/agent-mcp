hor="start" xml:space="preserve" style="white-space:pre">$ python3 01_basic/main.py</text><text x="80" y="226" font-family="ui-monospace, Menlo, 'SF Mono', monospace" font-size="15" font-weight="400" fill="#122033" text-anchor="start" xml:space="preserve" style="white-space:pre">[1] initialize 완료 — 서버와 연결됨</text><text x="80" y="252" font-family="ui-monospace, Menlo, 'SF Mono', monospace" font-size="15" font-weight="400" fill="#122033" text-anchor="start" xml:space="preserve" style="white-space:pre">[2] 발견(*/list)</text><text x="80" y="278" font-family="ui-monospace, Menlo, 'SF Mono', monospace" font-size="15" font-weight="400" fill="#122033" text-anchor="start" xml:space="preserve" style="white-space:pre">    tools    : ['add']</text><text x="80" y="304" font-family="ui-monospace, Menlo, 'SF Mono', monospace" font-size="15" font-weight="400" fill="#122033" text-anchor="start" xml:space="preserve" style="white-space:pre">    resources: ['demo://about']</text><text x="80" y="330" font-family="ui-monospace, Menlo, 'SF Mono', monospace" font-size="15" font-weight="400" fill="#122033" text-anchor="start" xml:space="preserve" style="white-space:pre">    templates: ['greeting://{name}']</text><text x="80" y="356" font-family="ui-monospace, Menlo, 'SF Mono', monospace" font-size="15" font-weight="400" fill="#122033" text-anchor="start" xml:space="preserve" style="white-space:pre">    prompts  : ['summarize']</text><text x="80" y="382" font-family="ui-monospace, Menlo, 'SF Mono', monospace" font-size="15" font-weight="400" fill="#122033" text-anchor="start" xml:space="preserve" style="white-space:pre">[3] 호출</text><text x="80" y="408" font-family="ui-monospace, Menlo, 'SF Mono', monospace" font-size="15" font-weight="400" fill="#122033" text-anchor="start" xml:space="preserve" style="white-space:pre">    tools/call add(2, 3) -&gt; 5</text><text x="80" y="434" font-family="ui-monospace, Menlo, 'SF Mono', monospace" font-size="15" font-weight="400" fill="#122033" text-anchor="start" xml:space="preserve" style="white-space:pre">    resources/read greeting://MCP -&gt; 안녕하세요, MCP님</text><text x="80" y="460" font-family="ui-monospace, Menlo, 'SF Mono', monospace" font-size="15" font-weight="400" fill="#122033" text-anchor="start" xml:space="preserve" style="white-space:pre">    prompts/get summarize -&gt; '다음 글을 3줄로 ...'</text><text x="80" y="486" font-family="ui-monospace, Menlo, 'SF Mono', monospace" font-size="15" font-weight="400" fill="#122033" text-anchor="start" xml:space="preserve" style="white-space:pre">[4] LLM이 도구를 고른다 (DeepSeek)</text><text x="80" y="512" font-family="ui-monospace, Menlo, 'SF Mono', monospace" font-size="15" font-weight="400" fill="#122033" text-anchor="start" xml:space="preserve" style="white-space:pre">    LLM 요청 → tools/call add({'a': 17, 'b': 25}) -&gt; 42</text><text x="730" y="188" font-family="ui-monospace, Menlo, 'SF Mono', monospace" font-size="20" font-weight="700" fill="#122033" text-anchor="start" xml:space="preserve" style="white-space:pre">[보고서] 01_basic</text><rect x="730" y="202" width="270" height="42" rx="4" fill="#1769aa"/><text x="742" y="230" font-family="ui-monospace, Menlo, 'SF Mono', monospace" font-size="16" font-weight="700" fill="#ffffff" text-anchor="start" xml:space="preserve" style="white-space:pre">구분</text><rect x="1000" y="202" width="100" height="42" rx="4" fill="#1769aa"/><text x="1012" y="230" font-family="ui-monospace, Menlo, 'SF Mono', monospace" font-size="16" font-weight="700" fill="#ffffff" text-anchor="start" xml:space="preserve" style="white-space:pre">status</text><rect x="1100" y="202" width="120" height="42" rx="4" fill="#1769aa"/><text x="1112" y="230" font-family="ui-monospace, Menlo, 'SF Mono', monospace" font-size="16" font-weight="700" fill="#ffffff" text-anchor="start" xml:space="preserve" style="white-space:pre">elapsed_ms</text><rect x="730" y="244" width="270" height="42" rx="0" fill="#ffffff" stroke="#c9d5e1" stroke-width="1"/><text x="742" y="271" font-fami