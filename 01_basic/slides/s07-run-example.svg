, sans-serif" font-size="20" font-weight="700" fill="#122033" text-anchor="middle" xml:space="preserve" style="white-space:pre">로그(중간 과정)와 보고서(결과)는 분리</text><text x="975" y="548" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="20" font-weight="400" fill="#516174" text-anchor="middle" xml:space="preserve" style="white-space:pre">결과는 표에서 본다</text><text x="60" y="700" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="16" font-weight="400" fill="#516174" text-anchor="start" xml:space="preserve" style="white-space:pre">MCP · 01 · 기본</text><text x="1220" y="700" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="16" font-weight="600" fill="#516174" text-anchor="end" xml:space="preserve" style="white-space:pre">07</text></svg>
