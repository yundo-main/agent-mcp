 KR', sans-serif" font-size="22" font-weight="600" fill="#516174" text-anchor="middle" xml:space="preserve" style="white-space:pre">먼저 각자 답을 말해 보고, 다음 장에서 확인한다</text><text x="60" y="700" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="16" font-weight="400" fill="#516174" text-anchor="start" xml:space="preserve" style="white-space:pre">MCP · 01 · 기본</text><text x="1220" y="700" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="16" font-weight="600" fill="#516174" text-anchor="end" xml:space="preserve" style="white-space:pre">08</text></svg>
