<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-label="치트시트"><defs><marker id="ah1769aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1769aa"/></marker><marker id="ah516174" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#516174"/></marker><marker id="ah1a7f4b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1a7f4b"/></marker><marker id="ahc0392b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#c0392b"/></marker><marker id="ahb86e00" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#b86e00"/></marker><marker id="ah8a96a3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8a96a3"/></marker></defs><rect width="1280" height="720" fill="#f8fafc"/><rect width="1280" height="10" fill="#1769aa"/><text x="60" y="90" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="40" font-weight="700" fill="#122033" text-anchor="start" xml:space="preserve" style="white-space:pre">치트시트</text><text x="60" y="134" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="22" font-weight="400" fill="#516174" text-anchor="start" xml:space="preserve" style="white-space:pre">이 한 장이 과정 전체</text><rect x="60" y="165" width="560" height="230" rx="14" fill="#ffffff" stroke="#1769aa" stroke-width="2.5"/><rect x="60" y="165" width="560" height="48" rx="14" fill="#1769aa"/><rect x="60" y="189" width="560" height="24" fill="#1769aa"/><text x="82" y="198" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="22" font-weight="700" fill="#ffffff" text-anchor="start" xml:space="preserve" style="white-space:pre">3대 기둥</text><text x="82" y="255" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="18" font-weight="400" fill="#122033" text-anchor="start" xml:space="preserve" style="white-space:pre">Resources — 앱이 붙인다 (읽을거리)</text><text x="82" y="289" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="18" font-weight="400" fill="#122033" text-anchor="start" xml:space="preserve" style="white-space:pre">Tools — 모델이 호출한다 (실행 도구)</text><text x="82" y="323" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="18" font-weight="400" fill="#122033" text-anchor="start" xml:space="preserve" style="white-space:pre">Prompts — 사용자가 고른다 (템플릿)</text><rect x="660" y="165" width="560" height="230" rx="14" fill="#ffffff" stroke="#1a7f4b" stroke-width="2.5"/><rect x="660" y="165" width="560" height="48" rx="14" fill="#1a7f4b"/><rect x="660" y="189" width="560" height="24" fill="#1a7f4b"/><text x="682" y="198" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="22" font-weight="700" fill="#ffffff" text-anchor="start" xml:space="preserve" style="white-space:pre">흐름과 메서드</text><text x="682" y="255" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="18" font-weight="400" fill="#122033" text-anchor="start" xml:space="preserve" style="white-space:pre">initialize → */list → */call</text><text x="682" y="289" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="18" font-weight="400" fill="#122033" text-anchor="start" xml:space="preserve" style="white-space:pre">tools/call · resources/read · prompts/get</text><text x="682" y="323" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="18" font-weight="400" fill="#122033" text-anchor="start" xml:space="preserve" style="white-space:pre">주소 템플릿은 list_resource_templates</text><rect x="60" y="415" width="560" height="230" rx="14" fill="#ffffff" stroke="#b86e00" stroke-width="2.5"/><rect x="60" y="415" width="560" height="48" rx="14" fill="#b86e00"/><rect x="60" y="439" width="560" height="24" fill="#b86e00"/><text x="82" y="448" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="22" font-weight="700" fill="#ffffff" text-anchor="start" xml:space="preserve" style="white-space:pre">전송 방식</text><text x="82" y="505" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="18" font-weight="400" fill="#122033" text-anchor="start" xml:space="preserve" style="white-space:pre">stdio — 로컬 · 단일 사용자</text><text x="82" y="539" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="18" font-weight="400" fill="#122033" text-anchor="start" xml:space="preserve" style="white-space:pre">Streamable HTTP — 원격 · 다중 사용자 + OAuth</text><text x="82" y="573" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="18" font-weight="400" fill="#122033" text-anchor="start" xml:space="preserve" style="white-space:pre">프로토콜은 JSON-RPC 2.0 기반</text><rect x="660" y="415" width="560" height="230" rx="14" fill="#ffffff" stroke="#c0392b" stroke-width="2.5"/><rect x="660" y="415" width="560" height="48" rx="14" fill="#c0392b"/><rect x="660" y="439" width="560" height="24" fill="#c0392b"/><text x="682" y="448" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="22" font-weight="700" fill="#ffffff" text-anchor="start" xml:space="preserve" style="white-space:pre">안전 체크리스트</text><text x="682" y="505" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="18" font-weight="400" fill="#122033" text-anchor="start" xml:space="preserve" style="white-space:pre">허용 디렉터리 · 읽기 전용 DB 롤</text><text x="682" y="539" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="18" font-weight="400" fill="#122033" text-anchor="start" xml:space="preserve" style="white-space:pre">서버 설정이 아니라 권한으로 막는다</text><text x="682" y="573" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="18" font-weight="400" fill="#122033" text-anchor="start" xml:space="preserve" style="white-space:pre">위험한 도구 앞에는 사람 승인(HITL)</text><text x="682" y="607" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="18" font-weight="400" fill="#122033" text-anchor="start" xml:space="preserve" style="white-space:pre">출처·유지 상태·버전을 확인한다</text><text x="60" y="700" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="16" font-weight="400" fill="#516174" text-anchor="start" xml:space="preserve" style="white-space:pre">MCP · 99 · 참고</text><text x="1220" y="700" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="16" font-weight="600" fill="#516174" text-anchor="end" xml:space="preserve" style="white-space:pre">05</text></svg>
